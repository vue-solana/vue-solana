name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build:packages

      - name: Size check packages
        run: pnpm size:packages

      - name: Build entries vs exports map check
        run: pnpm check:entries

      - name: ESM-only exports map check
        run: pnpm check:esm-map

      - name: Externals bundling check
        run: pnpm check:externals

      - name: Buffer-polyfill declarations check
        run: pnpm check:buffer-polyfill-declarations

      - name: Pack size check
        run: pnpm pack:size

      - name: E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
